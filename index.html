<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>UTXO Ledger System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ganti pakai yang ini, lebih stabil buat narik library-nya -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="text/javascript"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-10 border-b border-gray-700 pb-5">
            <h1 class="text-3xl font-bold text-blue-400">UTXO System <span class="text-sm font-normal text-gray-400">Sepolia Testnet</span></h1>
            <button onclick="connectWallet()" id="btnConnect" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-bold">Connect MetaMask</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Panel Kiri: Dompet & Mint -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg">
                <h2 class="text-xl mb-4 font-semibold text-gray-300">Dompet Digital</h2>
                <div class="bg-gray-700 p-4 rounded-lg mb-6">
                    <p class="text-sm text-gray-400">Total Saldo:</p>
                    <p class="text-4xl font-mono text-green-400" id="totalBalance">0</p>
                </div>

                <div class="mb-4">
                    <label class="block text-sm mb-1">Minting Baru (Simulasi)</label>
                    <div class="flex gap-2">
                        <input type="number" id="mintAmt" class="bg-gray-900 border border-gray-600 rounded px-3 py-2 flex-grow" placeholder="Jumlah">
                        <button onclick="handleMint()" class="bg-green-600 px-4 rounded hover:bg-green-700">Mint</button>
                    </div>
                </div>

                <h3 class="text-sm font-bold text-gray-400 mt-6 mb-2 uppercase">Daftar UTXO Aktif (Lembaran Uang)</h3>
                <div id="utxoList" class="space-y-2 text-sm max-h-48 overflow-y-auto">
                    <!-- UTXO Items -->
                </div>
            </div>

            <!-- Panel Kanan: Kirim Transaksi -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg">
                <h2 class="text-xl mb-4 font-semibold text-gray-300">Kirim Pembayaran</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs mb-1">Address Penerima</label>
                        <input type="text" id="toAddr" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs mb-1">Jumlah</label>
                        <input type="number" id="sendAmt" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs mb-1 italic text-yellow-500 underline">Input UTXO ID (Gunakan koma, misal: 0,1)</label>
                        <input type="text" id="useIds" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2" placeholder="ID mana yang mau dihancurkan?">
                    </div>
                    <button onclick="handleSend()" class="w-full bg-blue-600 py-3 rounded-lg font-bold hover:bg-blue-700 mt-2">Eksekusi Transaksi</button>
                </div>
            </div>
        </div>

        <!-- Log Transaksi Bawah -->
        <div class="mt-10 bg-gray-800 p-6 rounded-xl shadow-lg">
            <h2 class="text-xl mb-4 font-semibold text-gray-300">Log Transaksi & Status Spent</h2>
            <div class="overflow-x-auto text-xs">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-gray-500 border-b border-gray-700">
                            <th class="p-2">TX ID</th>
                            <th class="p-2">Dari</th>
                            <th class="p-2">Ke</th>
                            <th class="p-2">Jumlah</th>
                            <th class="p-2">Waktu</th>
                        </tr>
                    </thead>
                    <tbody id="txLog"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let contract;
        const contractAddress = "0xf89dE373479B139fc6c9f677a54b898e231D99DE";
        const abi = [
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "_amount",
				"type": "uint256"
			}
		],
		"name": "mint",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "_to",
				"type": "address"
			},
			{
				"internalType": "uint256",
				"name": "_amount",
				"type": "uint256"
			},
			{
				"internalType": "uint256[]",
				"name": "_utxoIdsToUse",
				"type": "uint256[]"
			}
		],
		"name": "sendPayment",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"anonymous": false,
		"inputs": [
			{
				"indexed": true,
				"internalType": "uint256",
				"name": "txId",
				"type": "uint256"
			},
			{
				"indexed": true,
				"internalType": "address",
				"name": "from",
				"type": "address"
			},
			{
				"indexed": true,
				"internalType": "address",
				"name": "to",
				"type": "address"
			},
			{
				"indexed": false,
				"internalType": "uint256",
				"name": "amount",
				"type": "uint256"
			}
		],
		"name": "TxLogged",
		"type": "event"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"name": "allUtxos",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "id",
				"type": "uint256"
			},
			{
				"internalType": "address",
				"name": "owner",
				"type": "address"
			},
			{
				"internalType": "uint256",
				"name": "amount",
				"type": "uint256"
			},
			{
				"internalType": "bool",
				"name": "spent",
				"type": "bool"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "_user",
				"type": "address"
			}
		],
		"name": "getActiveUtxos",
		"outputs": [
			{
				"components": [
					{
						"internalType": "uint256",
						"name": "id",
						"type": "uint256"
					},
					{
						"internalType": "address",
						"name": "owner",
						"type": "address"
					},
					{
						"internalType": "uint256",
						"name": "amount",
						"type": "uint256"
					},
					{
						"internalType": "bool",
						"name": "spent",
						"type": "bool"
					}
				],
				"internalType": "struct UtxoEngine.UTXO[]",
				"name": "",
				"type": "tuple[]"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "nextTxId",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "nextUtxoId",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"name": "txHistory",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "txId",
				"type": "uint256"
			},
			{
				"internalType": "address",
				"name": "sender",
				"type": "address"
			},
			{
				"internalType": "address",
				"name": "receiver",
				"type": "address"
			},
			{
				"internalType": "uint256",
				"name": "amount",
				"type": "uint256"
			},
			{
				"internalType": "uint256",
				"name": "timestamp",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			},
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"name": "userInventory",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
];

         async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                contract = new ethers.Contract(contractAddress, abi, signer);
                document.getElementById('btnConnect').innerText = "Connected";
                refreshData();
            }
        }

        async function refreshData() {
            const signer = contract.signer;
            const address = await signer.getAddress();
            
            // Ambil UTXO Aktif
            const utxos = await contract.getActiveUtxos(address);
            let total = 0;
            let html = "";
            utxos.forEach(u => {
                total += parseInt(u.amount);
                html +=`
<div class="bg-gray-900 p-3 rounded-lg mb-2 flex justify-between items-center border-l-4 border-green-500 shadow-sm">
    <div>
        <span class="text-xs text-gray-400 block font-mono">UTXO ID: ${u.id}</span>
        <span class="text-white font-bold text-lg">${u.amount} <span class="text-sm font-normal text-gray-400">Unit</span></span>
    </div>
    <div class="text-right">
        <span class="bg-green-900 text-green-300 text-[10px] px-2 py-1 rounded-full border border-green-700 uppercase tracking-wider">
            ● Unspent
        </span>
    </div>
</div>`;
            });
            document.getElementById('totalBalance').innerText = total;
            document.getElementById('utxoList').innerHTML = html;

            // Load Tx History (Tampilkan 10 terakhir)
            const txCount = await contract.nextTxId();
            let txHtml = "";
            for (let i = txCount - 1; i >= 0; i--) {
                const tx = await contract.txHistory(i);
                txHtml += `<tr class="border-b border-gray-700">
    <td class="p-2 font-mono text-yellow-500">#${tx.txId}</td>
    <td class="p-2 text-gray-400">${tx.sender.substring(0,6)}...</td>
    <td class="p-2 text-gray-400">${tx.receiver.substring(0,6)}...</td>
    <td class="p-2 text-green-400 font-bold">${tx.amount}</td>
    <td class="p-2">
        <span class="bg-red-900 text-red-300 text-[10px] px-2 py-0.5 rounded border border-red-700 uppercase">
            Spent
        </span>
    </td>
    <td class="p-2 text-gray-500">${new Date(tx.timestamp * 1000).toLocaleTimeString()}</td>
</tr>`;
            }
            document.getElementById('txLog').innerHTML = txHtml;
        }

        async function handleMint() {
            const amt = document.getElementById('mintAmt').value;
            const tx = await contract.mint(amt);
            await tx.wait();
            refreshData();
        }

        async function handleSend() {
    const to = document.getElementById('toAddr').value;
    const amt = parseInt(document.getElementById('sendAmt').value);
    const idInput = document.getElementById('useIds').value;
    
    // 1. Validasi Input Kosong
    if (!to || !amt || !idInput) {
        alert("Waduh bro, isi dulu semua kolomnya!");
        return;
    }

    const ids = idInput.split(',').map(Number);

    try {
        // 2. Ambil data UTXO yang ada di dompet lu sekarang
        const signer = contract.signer;
        const address = await signer.getAddress();
        const utxos = await contract.getActiveUtxos(address);

        // 3. Validasi: Cek apakah ID yang diinput beneran milik user & jumlahnya cukup
        let totalInputAmt = 0;
        for (let id of ids) {
            const foundUtxo = utxos.find(u => parseInt(u.id) === id);
            if (!foundUtxo) {
                alert(`Error: UTXO ID #${id} nggak ada di dompet lu!`);
                return;
            }
            totalInputAmt += parseInt(foundUtxo.amount);
        }

        if (amt > totalInputAmt) {
            alert(`Saldo Kurang! Total lembaran yg lu pilih cuma ${totalInputAmt}, tapi mau kirim ${amt}.`);
            return;
        }

        // 4. Kalau lolos validasi, baru kirim ke Blockchain
        console.log("Validasi sukses, mengeksekusi transaksi...");
        const tx = await contract.sendPayment(to, amt, ids);
        
        // Kasih notifikasi biar dosen tau proses lagi jalan
        document.getElementById('txLog').innerHTML = `<tr><td colspan="6" class="text-center p-4 text-blue-400">Sedang memproses transaksi... Tunggu ya bro...</td></tr>` + document.getElementById('txLog').innerHTML;

        
        await tx.wait();
// Hapus alert-nya, ganti dengan refresh data otomatis
refreshData(); 

// (Opsional) Tambahin log kecil di konsol biar lu tau udah kelar
console.log("Transaksi Berhasil: UTXO lama sudah Spent.");

    } catch (error) {
        console.error(error);
        alert("Transaksi gagal di blockchain. Cek konsol atau saldo ETH lu.");
    }
}
    </script>
</body>
</html>
